services:

  db:
    image: postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_USER: user
      POSTGRES_DB: mydb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydb"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis
    ports: [ "6379:6379" ]

  rabbitmq:
    image: rabbitmq:4-management
    restart: always
    ports:
      - "5672:5672"   # AMQP (a aplicação conecta aqui)
      - "15672:15672" # painel web: http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: example

  backend:
    build: .
    restart: always
    # sem "ports": várias réplicas não cabem na mesma porta; só o nginx é exposto
    environment:
      PORT: 3000
      APP_URL: http://localhost
      DATABASE_URL: postgresql://user:example@db:5432/mydb
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://user:example@rabbitmq:5672
      # Auth (valores vêm do backend/.env; os defaults servem só para dev)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [backend]
