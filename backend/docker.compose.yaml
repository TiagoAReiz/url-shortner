services:

  db:
    image: postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_USER: user
      POSTGRES_DB: mydb

  redis:
    image: redis
    ports: [ "6379:6379" ]

  rabbitmq:
    image: rabbitmq:4-management
    restart: always
    ports:
      - "5672:5672"   # AMQP (a aplicação conecta aqui)
      - "15672:15672" # painel web: http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: example
