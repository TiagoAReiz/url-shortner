events {}

http {
  # DNS interno do Docker: cada réplica do serviço "backend" é um IP.
  # valid=5s => o nginx reconsulta o DNS a cada 5s, então réplicas
  # novas/recriadas entram sem reiniciar o nginx.
  resolver 127.0.0.11 valid=5s;

  server {
    listen 80;

    location / {
      # Usar variável no proxy_pass é o que faz o nginx re-resolver o nome
      # (um bloco "upstream" resolveria só uma vez, na partida).
      # Com vários IPs no DNS, ele reveza entre eles (round-robin).
      set $backend http://backend:3000;
      proxy_pass $backend;

      # Repassa quem realmente fez a requisição.
      # Sem isso o backend só enxerga o IP do nginx.
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Se uma réplica cair, tenta a próxima.
      proxy_next_upstream error timeout http_502 http_503;
    }
  }
}
