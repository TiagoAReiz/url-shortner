# Sobe a stack inteira:
#   docker compose up -d --build --scale backend=3
#
# Variáveis (GOOGLE_CLIENT_ID, JWT_SECRET, ...) vêm do arquivo .env na raiz (veja .env.example).

name: url-shortner

services:
  # ---------- infraestrutura ----------
  db:
    image: postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_USER: user
      POSTGRES_DB: mydb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydb"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis
    restart: always
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:4-management
    restart: always
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # painel web: http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: example
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  # ---------- aplicação ----------
  backend:
    build: ./backend
    restart: always
    # sem "ports": várias réplicas não cabem na mesma porta; só o nginx é exposto
    environment:
      PORT: 3000
      APP_URL: http://localhost
      DATABASE_URL: postgresql://user:example@db:5432/mydb
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://user:example@rabbitmq:5672
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  statistics_consumer:
    build: ./statistics_consumer
    restart: always
    environment:
      DATABASE_URL: postgresql://user:example@db:5432/mydb
      RABBITMQ_URL: amqp://user:example@rabbitmq:5672
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # as tabelas são criadas pelo backend (prisma db update) ao subir
      backend:
        condition: service_started

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      args:
        # o navegador acessa a API pelo nginx
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: always
    ports:
      - "${FRONTEND_PORT:-5173}:3000"
    depends_on:
      - nginx
